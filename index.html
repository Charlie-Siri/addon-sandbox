<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Addon Sandbox</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%23f2c14e'/%3E%3Cpath d='M10 21l6-11 6 11z' fill='%2312151c'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span>Addon Sandbox</div>
    <div class="status" id="status">Starting…</div>
    <div class="spacer"></div>
    <button id="btn-pause" title="Stop time: timers and OnUpdate">Pause</button>
    <button id="btn-reload" class="primary" title="Save SavedVariables and reload (Ctrl+R, /reload)">Reload</button>
  </header>
  <main class="layout">
    <section class="stage-wrap">
      <div class="stage" id="stage" tabindex="0">
        <div class="ui" id="ui"></div>
        <div class="overlay" id="overlay"></div>
        <div class="uc-layer" id="uc-layer"></div>
      </div>
    </section>
    <aside class="side">
      <nav class="tabs" id="tabs">
        <button data-tab="world">World</button>
        <button data-tab="events">Events</button>
        <button data-tab="frames">Frames</button>
        <button data-tab="addons">Addons</button>
        <button data-tab="apis">APIs</button>
        <button data-tab="usecases">Use cases</button>
      </nav>
      <div class="tab-body" id="tab-world"></div>
      <div class="tab-body" id="tab-events" hidden></div>
      <div class="tab-body" id="tab-frames" hidden></div>
      <div class="tab-body" id="tab-addons" hidden></div>
      <div class="tab-body" id="tab-apis" hidden></div>
      <div class="tab-body" id="tab-usecases" hidden></div>
    </aside>
  </main>
  <footer class="bottom">
    <section class="chat">
      <div class="panel-head">Chat</div>
      <div class="chat-log" id="chat-log"></div>
      <input id="chat-input" autocomplete="off" spellcheck="false" placeholder="Slash commands and Lua: /vp, /run print(GetMoney()), /dump GetBuildInfo(), /fstack, /reload">
    </section>
    <section class="errors">
      <div class="panel-head">Errors <span class="badge" id="err-count">0</span><span class="spacer"></span><button id="err-clear" class="small">Clear</button></div>
      <div class="err-list" id="err-list"></div>
    </section>
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
